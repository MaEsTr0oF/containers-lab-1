name: Validate Kubernetes Manifests

on:
  push:
    branches: [ main, master, "lab2/**" ]
    paths:
      - "k8s/**"
      - ".github/workflows/k8s-validation.yml"
  pull_request:
    paths:
      - "k8s/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate K8s YAML manifests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate YAML syntax with yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: k8s/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              indentation:
                spaces: 2
                indent-sequences: true
              truthy:
                check-keys: false

      - name: Validate manifests with kubectl (dry-run, client-side)
        run: |
          for f in k8s/*.yaml; do
            echo "::group::$f"
            kubectl apply --dry-run=client -f "$f"
            echo "::endgroup::"
          done

      - name: Validate against Kubernetes schema (kubeconform)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.28.0 k8s/
